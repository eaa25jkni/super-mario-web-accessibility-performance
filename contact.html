<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marioclub - Contact</title>

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body>
    <header>
        <a href="index.html" class="logo">Marioclub</a>
    </header>
    <section class="banner">
        <img src="img/banner.webp" alt="marioclub welcome banner">
        <div class="welcome">
            <h1>Get in Touch<br><span>with Marioclub</span></h1>
        </div>
    </section>
    <nav class="main-nav">
        <ul>
            <li><a href="index.html">Join the club</a></li>
            <li><a href="news.html">Latest news</a></li>
            <li><a href="games.html">New games</a></li>
            <li><a href="contact.html" class="join" aria-current="page">Contact</a></li>
        </ul>
    </nav>
    <main>
        <article>
            <h2>Get in touch with me, Mario</h2>
            <form class="form-contact">
                <label for="firstname">First name</label>
                <input
                    type="text" id="firstname" name="fname" autocomplete="given-name" required
                >

                <label for="lastname">Last name</label>
                <input
                    type="text" id="lastname" name="lname" autocomplete="family-name" required
                >

        <br/>
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="name@example.com"
                    required
                >

                
                <label for="country">Country</label>
                <input
                    list="countries"
                    name="country"
                    id="country"
                    autocomplete="country-name"
                >
                <datalist id="countries">
                    <option value="Albania">
                    <option value="Austria">
                    <option value="Belarus">
                    <option value="Belgium">
                    <option value="Bosnia">
                    <option value="Bulgaria">
                    <option value="Croatia">
                    <option value="Czech Republic">
                    <option value="Denmark">
                    <option value="Finland">
                    <option value="France">
                    <option value="Georgia">
                    <option value="Germany">
                    <option value="Greece">
                    <option value="Hungary">
                    <option value="Ireland">
                    <option value="Italy">
                    <option value="Kazakhstan">
                    <option value="Lithuania">
                    <option value="Netherlands">
                    <option value="Norway">
                    <option value="Poland">
                    <option value="Portugal">
                    <option value="Romania">
                    <option value="Russia">
                    <option value="Serbia">
                    <option value="Slovakia">
                    <option value="Spain">
                    <option value="Turkey">
                    <option value="Sweden">
                    <option value="Switzerland">
                    <option value="Ukraine">
                    <option value="United Kingdom">
                </datalist>

                <br />

                <label for="question">Your question</label>
                <textarea rows="4" cols="40"
                    id="question"
                    name="question"
                    placeholder="Ask a question..."
                ></textarea>
                
                <button class="submit-knap" type="submit">Get in Touch</button>
            </form>
        </article>
        <ul class="images">
            <li><img src="img/thumb-1.webp" alt="" loading="lazy"></li>
            <li><img src="img/thumb-2.webp" alt="" loading="lazy"></li>
        </ul>
    </main>
    <section class="join">
        <h2>Contact Us today!</h2>
        <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Corporis dignissimos minus voluptatem.</p>
        <form class="form-email">
            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="name@example.com"
                required
            >

            <button type="submit">Join the club</button>
        </form>

    </section>
    <footer>
        <p class="copyright">Copyright 2019 Marioclub</p>
    </footer>
</body>

</html>
